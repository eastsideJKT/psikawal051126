<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawal Sidang Jokowi</title>
    
    <!-- SUPABASE JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #28a745;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2, h3 {
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-success { background-color: var(--secondary-color); }
        .btn-secondary { background-color: #6c757d; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 480px;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .review-list p {
            margin: 8px 0;
            border-bottom: 1px dashed #eee;
            padding-bottom: 4px;
            text-align: left;
        }

        .spinner {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>REGISTRASI RELAWAN SIDANG JOKOWI PSI JAKTIM</h2>
    <form id="registrationForm" onsubmit="handleReview(event)">
        <div class="form-group">
            <label>Nama Lengkap:</label>
            <input type="text" id="nama" required>
        </div>

        <div class="form-group">
            <label>Jenis Kelamin:</label>
            <select id="jenisKelamin" required>
                <option value="">-- Pilih Jenis Kelamin --</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
        </div>

        <div class="form-group">
            <label>No. HP / WhatsApp:</label>
            <input type="tel" id="noHp" placeholder="08xxxxxxxxxx" required>
        </div>

        <div class="form-group">
            <label>Upload Foto/Scan KTA:</label>
            <input type="file" id="fileKta" accept="image/*,application/pdf" required>
            <small style="color: #666; font-size: 12px;">Format gambar (JPG/PNG) atau PDF, maks. 5MB.</small>
        </div>

        <div class="form-group">
            <label>Kecamatan (Jakarta Timur):</label>
            <select id="kecamatan" onchange="updateKelurahan()" required>
                <option value="">-- Pilih Kecamatan --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kelurahan:</label>
            <select id="kelurahan" required disabled>
                <option value="">-- Pilih Kecamatan Terlebih Dahulu --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pengurus Tingkat:</label>
            <select id="pengurus" onchange="updateJabatan()" required>
                <option value="">-- Pilih Pengurus --</option>
                <option value="DPRt">DPRt</option>
                <option value="DPC">DPC</option>
				<option value="DPD">DPD</option>
				<option value="Anggota">Anggota</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jabatan:</label>
            <select id="jabatan" required disabled>
                <option value="">-- Pilih Pengurus Terlebih Dahulu --</option>
            </select>
        </div>

        <button type="submit" class="btn">Tinjau Dulu</button>
    </form>
</div>

<!-- POP-UP MODAL REVIEW -->
<div id="reviewModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Review Pendaftaran</h3>
        <div class="review-list" id="reviewContent"></div>
        <div id="loadingText" class="spinner">Memeriksa data & mengunggah KTA... Mohon tunggu.</div>
        <div class="modal-actions" id="modalButtons">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Edit</button>
            <button type="button" class="btn btn-success" onclick="confirmAndSubmit()">Kirim Pendaftaran</button>
        </div>
    </div>
</div>

<script>
    // CONFIG SUPABASE
    const SUPABASE_URL = "https://ropbwbvjqrdzycabgwyt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_K4EyVCYmXMIKPuXKVk94dw_J0vfPPq9";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const dataJakartaTimur = {
        "Cakung": ["Cakung Barat", "Cakung Timur", "Jatinegara", "Penggilingan", "Pulo Gebang", "Rawa Terate", "Ujung Menteng"],
        "Cipayung": ["Bambu Apus", "Ceger", "Cilangkap", "Cipayung", "Lubang Buaya", "Munjul", "Pondok Ranggon", "Setu"],
        "Ciracas": ["Cibubur", "Ciracas", "Kelapa Dua Wetan", "Rambutan", "Susukan"],
        "Duren Sawit": ["Duren Sawit", "Pondok Bambu", "Pondok Kelapa", "Pondok Kopi", "Malaka Jaya", "Malaka Sari", "Klender"],
        "Jatinegara": ["Bali Mester", "Bidara Cina", "Cipinang Cempedak", "Cipinang Besar Selatan", "Cipinang Besar Utara", "Cipinang Muara", "Kampung Melayu", "Rawa Bunga"],
        "Kramat Jati": ["Balekambang", "Batu Ampar", "Cawang", "Cililitan", "Dukuh", "Kramat Jati", "Tengah"],
        "Makasar": ["Cipinang Melayu", "Kebon Pala", "Makasar", "Pinang Ranti", "Halim Perdanakusuma"],
        "Matraman": ["Kayu Manis", "Kebon Manggis", "Pal Meriam", "Pisangan Baru", "Utan Kayu Selatan", "Utan Kayu Utara"],
        "Pasar Rebo": ["Baru", "Cijantung", "Gedong", "Kalisari", "Pekayon"],
        "Pulo Gadung": ["Cipinang", "Jatinegara", "Jati", "Kayu Putih", "Pisangan Timur", "Pulo Gadung", "Rawamangun"]
    };

    const dataJabatan = {
        "DPRt": ["Ketua", "Wakil Ketua 1", "Wakil Ketua 2", "Sekretaris", "Wakil Sekretaris", "Bendahara", "Wakil Bendahara", "Koord.W", "Koord.T", "Koord TPS"],
        "DPC": ["Ketua", "Sekretaris", "Wakil Sekretaris", "Bendahara", "Wakil Bendahara", "OKK", "BAPILU", "Badan Saksi", "IT & Digital", "UMKM"],
		"DPD": ["Ketua", "Sekretaris", "Bendahara", "Wakil Bendahara", "OKK", "BAPILU", "Badan Saksi", "IT & Digital", "UMKM", "Pemuda & Olah Raga"],
		"Anggota": ["Anggota Biasa"]
    };

    let payload = {};
    let selectedFile = null;

    window.onload = function() {
        const kecSelect = document.getElementById('kecamatan');
        Object.keys(dataJakartaTimur).forEach(kec => {
            let opt = document.createElement('option');
            opt.value = kec;
            opt.innerHTML = kec;
            kecSelect.appendChild(opt);
        });
    };

    function updateKelurahan() {
        const kec = document.getElementById('kecamatan').value;
        const kelSelect = document.getElementById('kelurahan');
        kelSelect.innerHTML = '<option value="">-- Pilih Kelurahan --</option>';

        if (kec && dataJakartaTimur[kec]) {
            kelSelect.disabled = false;
            dataJakartaTimur[kec].forEach(kel => {
                let opt = document.createElement('option');
                opt.value = kel;
                opt.innerHTML = kel;
                kelSelect.appendChild(opt);
            });
        } else {
            kelSelect.disabled = true;
        }
    }

    function updateJabatan() {
        const pengurus = document.getElementById('pengurus').value;
        const jabSelect = document.getElementById('jabatan');
        jabSelect.innerHTML = '<option value="">-- Pilih Jabatan --</option>';

        if (pengurus && dataJabatan[pengurus]) {
            jabSelect.disabled = false;
            dataJabatan[pengurus].forEach(jab => {
                let opt = document.createElement('option');
                opt.value = jab;
                opt.innerHTML = jab;
                jabSelect.appendChild(opt);
            });
        } else {
            jabSelect.disabled = true;
        }
    }

    function handleReview(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('fileKta');
        if (fileInput.files.length === 0) {
            alert("Harap upload foto/scan KTA terlebih dahulu!");
            return;
        }
        selectedFile = fileInput.files[0];

        payload = {
            nama: document.getElementById('nama').value,
            jenis_kelamin: document.getElementById('jenisKelamin').value,
            no_hp: document.getElementById('noHp').value,
            kecamatan: document.getElementById('kecamatan').value,
            kelurahan: document.getElementById('kelurahan').value,
            pengurus: document.getElementById('pengurus').value,
            jabatan: document.getElementById('jabatan').value,
            status: 'Belum Hadir'
        };

        document.getElementById('modalTitle').innerText = "Review Pendaftaran";
        document.getElementById('loadingText').innerText = "Memeriksa data & mengunggah KTA... Mohon tunggu.";
        document.getElementById('modalButtons').innerHTML = `
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Edit</button>
            <button type="button" class="btn btn-success" onclick="confirmAndSubmit()">Kirim Pendaftaran</button>
        `;

        const reviewHtml = `
            <p><strong>Nama:</strong> ${payload.nama}</p>
            <p><strong>Jenis Kelamin:</strong> ${payload.jenis_kelamin}</p>
            <p><strong>No. HP:</strong> ${payload.no_hp}</p>
            <p><strong>File KTA:</strong> ${selectedFile.name}</p>
            <p><strong>Kecamatan:</strong> ${payload.kecamatan}</p>
            <p><strong>Kelurahan:</strong> ${payload.kelurahan}</p>
            <p><strong>Pengurus:</strong> ${payload.pengurus}</p>
            <p><strong>Jabatan:</strong> ${payload.jabatan}</p>
        `;

        document.getElementById('reviewContent').innerHTML = reviewHtml;
        document.getElementById('reviewModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('reviewModal').style.display = 'none';
    }

    async function confirmAndSubmit() {
        document.getElementById('loadingText').style.display = 'block';
        document.getElementById('modalButtons').style.display = 'none';

        try {
            // Cek apakah nomor HP sudah terdaftar di database
            const { data: existingData, error: checkError } = await supabaseClient
                .from('pendaftaran')
                .select('no_hp')
                .eq('no_hp', payload.no_hp);

            if (checkError) throw checkError;

            if (existingData && existingData.length > 0) {
                document.getElementById('modalTitle').innerText = "Perhatian";
                document.getElementById('reviewContent').innerHTML = "<p style='text-align:center; font-size: 16px; font-weight: bold; color: #dc3545; border:none;'>ANDA SUDAH TERDAFTAR</p>";
                document.getElementById('modalButtons').innerHTML = `<button type="button" class="btn btn-secondary" onclick="closeModal()">Tutup</button>`;
                document.getElementById('modalButtons').style.display = 'flex';
                document.getElementById('loadingText').style.display = 'none';
                return;
            }

            // Upload file KTA ke Supabase Storage bucket 'kta_uploads'
            const fileExt = selectedFile.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
            const filePath = `kta_files/${fileName}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('kta_uploads')
                .upload(filePath, selectedFile);

            if (uploadError) throw uploadError;

            // Ambil public URL dari file yang di-upload
            const { data: publicUrlData } = supabaseClient.storage
                .from('kta_uploads')
                .getPublicUrl(filePath);

            payload.kta_url = publicUrlData.publicUrl;

            // Simpan data ke tabel pendaftaran
            const { data, error } = await supabaseClient
                .from('pendaftaran')
                .insert([payload]);

            if (error) throw error;

            // Reset form dan tampilkan pop-up sukses
            document.getElementById('registrationForm').reset();
            document.getElementById('kelurahan').disabled = true;
            document.getElementById('jabatan').disabled = true;

            document.getElementById('modalTitle').innerText = "Sukses Terkirim";
            document.getElementById('reviewContent').innerHTML = "<p style='text-align:center; font-size: 16px; font-weight: bold; color: #28a745; border:none;'>Terimakasih Sudah Mendaftar</p>";
            document.getElementById('modalButtons').innerHTML = `<button type="button" class="btn btn-success" onclick="closeModal()">Tutup</button>`;
            document.getElementById('modalButtons').style.display = 'flex';

        } catch (err) {
            alert('Terjadi kesalahan: ' + err.message);
            console.error(err);
            document.getElementById('modalButtons').style.display = 'flex';
        } finally {
            document.getElementById('loadingText').style.display = 'none';
        }
    }
</script>

</body>
</html>
